<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader"> 
      <div class="settingButtons">
        <button routerLink="/set" id="settingsRB" #settingsRB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionRB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="rbPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form RB">
            <div class="form-line" id="rb-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputRB min="1" readonly>
            </div>
            <div class="form-line" id="rb-hold-item">
              <img src="assets/images/pause.png">
              <input type="number" value="7" #hold1InputRB min="1" readonly>
            </div>
            <div class="form-line" id="rb-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="8" #exhaleInputRB min="1" readonly>
            </div>
          </div>
          <div class="RBtimer-container">
            <select #RBtimeInput class="countdownDisplay" id="rb-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #RBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnRB class="ballButton">
              <div #RBball class="ball">
                <span #RBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="rb-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnRB" #stopBtnRB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="RBSave" #RBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="RBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneRB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayRB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #RBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
