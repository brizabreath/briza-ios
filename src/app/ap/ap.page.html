<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsAP" #settingsAP class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionAP type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>   
  <div id="apPage">
    <div class="breathingpages">
        <div class="main-container">
          <div class="timer-status">
              <div class="settings-form AP">
                  <div class="form-line" id="ap-minus-btn">
                    <button class="buttonminus" type="button" #minusAP>-</button>
                  </div>  
                  <div class="form-line" id="ap-inhale-item">
                      <img src="assets/images/in.png">
                      <input type="number" value="3" #inhaleInputAP min="1" readonly>
                  </div>
                  <div class="form-line" id="ap-hold-item">
                      <img src="assets/images/pause.png">
                      <input type="number" value="12" #hold1InputAP min="1" readonly>
                  </div>
                  <div class="form-line" id="ap-exhale-item">
                      <img src="assets/images/out.png">
                      <input type="number" value="6" #exhaleInputAP min="1" readonly>
                  </div>
                  <div class="form-line" id="ap-plus-btn">
                    <button class="buttonplus" type="button" #plusAP>+</button>
                  </div>
              </div>
              <div class="APtimer-container">
                  <select #APtimeInput class="countdownDisplay" id="ap-duration-select">
                      <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
                      <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
                      <option value="60" *ngIf="!isPortuguese">1 minute</option>
                      <option value="60" *ngIf="isPortuguese">1 minuto</option>
                  </select>
                  <input #APcountdownInput class="countdownDisplay" style="display: none;" readonly />
              </div>
              <div class="center-container">
                <button #startBtnAP class="ballButton">
                  <div #APball class="ball">
                      <span #APballText></span>
                      <img src="assets/images/3dBall.png" alt="3D Ball" id="ap-start-ball">
                    </div>
                </button>
              </div>   
              <div class="timer-controls">
                  <button type="button" class="stopBtn" id="stopBtnAP" #stopBtnAP>
                    <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
                  </button>
                  <button type="button" class="saveBtn" id="APSave" #APSave>
                    <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
                  </button>
                  <form method="post" id="APForm">
                      <div class="roundbox">
                          <div>Rounds:</div><div #roundsDoneAP>0</div>
                          <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayAP>00 : 00</div>
                      </div>
                  </form>
              </div>
          </div>
      </div>
      <div #APResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
