<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsBB" #settingsBB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionBB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="bbPage">
    <div class="breathingpages2">
      <p class="centeredText" *ngIf="!isPortuguese">Breathe as lightly as possible and try to<br>sustain a gentle air hunger during the session</p>
      <p class="centeredText" *ngIf="isPortuguese">Respire o mais suavemente possível e tente<br>manter uma leve sensação de falta de ar durante a sessão</p>
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form BB">
            <div class="form-line" id="bb-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputBB min="1" readonly>
            </div>
            <div class="form-line" id="bb-hold1-item">
              <img src="assets/images/pause.png">
              <input type="number" value="2" #hold1InputBB min="1" readonly>
            </div>
            <div class="form-line" id="bb-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="6" #exhaleInputBB min="1" readonly>
            </div>
            <div class="form-line" id="bb-hold2-item">
              <img src="assets/images/pause.png">
              <input type="number" value="2" #hold2InputBB min="1" readonly>
            </div>
          </div>
          <div class="BBtimer-container">
            <select #BBtimeInput class="countdownDisplay" id="bb-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #BBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnBB class="ballButton" >
              <div #BBball class="ball">
                <span #BBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="bb-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnBB" #stopBtnBB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="BBSave" #BBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="BBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneBB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayBB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #BBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
