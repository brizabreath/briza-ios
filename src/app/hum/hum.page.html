<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsHUM" #settingsHUM class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionHUM type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="bbPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form HUM">
            <div class="form-line" id="hum-minus-btn">
              <button class="buttonminus" type="button" #minusHUM>-</button>
            </div>  
            <div class="form-line" id="hum-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputHUM min="1" readonly>
            </div>
            <div class="form-line" id="hum-hold1-item">
              <img src="assets/images/pause.png">
              <input type="number" value="2" #hold1InputHUM min="1" readonly>
            </div>
            <div class="form-line" id="hum-exhale-item">
              <img src="assets/images/hum.png">
              <input type="number" value="6" #exhaleInputHUM min="1" readonly>
            </div>
            <div class="form-line" id="hum-hold2-item">
              <img src="assets/images/pause.png">
              <input type="number" value="2" #hold2InputHUM min="1" readonly>
            </div>
            <div class="form-line" id="hum-plus-btn">
              <button class="buttonplus" type="button" #plusHUM>+</button>
            </div>
          </div>
          <div class="HUMtimer-container">
            <select #HUMtimeInput class="countdownDisplay" id="hum-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #HUMcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnHUM class="ballButton">
              <div #HUMball class="ball">
                <span #HUMballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="hum-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnHUM" #stopBtnHUM>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="HUMSave" #HUMSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="HUMForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneHUM>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayHUM>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #HUMResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
