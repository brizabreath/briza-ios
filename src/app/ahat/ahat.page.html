<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsAHAT" #settingsAHAT class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionAHAT type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="ahatPage">
    <div class="breathingpages">
        <div class="main-container">
          <div class="timer-status">
              <div class="settings-form AHAT">
                  <div class="form-line" id="ahat-hold-item">
                      <img src="assets/images/hold.png">
                      <input value="∞" #holdInputAHAT min="1" readonly>
                  </div>
                  <div class="form-line" id="ahat-light-item">
                      <img src="assets/images/lit.png">
                      <input type="number" value="15" #lightInputAHAT min="1" readonly>
                  </div>
                  <div class="form-line" id="ahat-normal-item">
                      <img src="assets/images/nor.png">
                      <input type="number" value="30" #normalInputAHAT min="1" readonly>
                  </div>
              </div>
              <div class="AHATtimer-container">
                  <select #AHATtimeInput class="countdownDisplay" id="ahat-rounds-box">
                      <option value="infinity" *ngIf="!isPortuguese">∞ rounds</option>
                      <option value="infinity" *ngIf="isPortuguese">∞ rodadas</option>
                      <option value="1" *ngIf="!isPortuguese">1 round</option>
                      <option value="1" *ngIf="isPortuguese">1 rodada</option>
                  </select>
                  <input #AHATcountdownInput class="countdownDisplay" style="display: none;" readonly />
              </div>
              <div class="center-container">
                <button #startBtnAHAT class="ballButton">
                  <div #AHATball class="ball">
                      <span #AHATballText></span>
                      <img src="assets/images/3dBall.png" alt="3D Ball"  id="ahat-start-ball">
                    </div>
                </button>
              </div>   
              <div class="timer-controls">
                  <button type="button" class="stopBtn" id="AHATReset" #AHATReset>
                    <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
                  </button>
                  <button type="button" class="saveBtn" id="AHATSave" #AHATSave>
                    <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
                  </button>
                  <form method="post" id="AHATForm">
                      <div class="roundbox">
                          <div>Rounds:</div><div #roundsDoneAHAT>0</div>
                          <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayAHAT>00 : 00</div>
                      </div>
                  </form>
                  <div #AHATResults></div>
              </div>
          </div>
      </div>
      <div #AHATResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
