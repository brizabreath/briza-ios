<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsBOX" #settingsBOX class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionBOX type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="boxPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form BOX">
            <div class="form-line" id="box-minus-btn">
              <button class="buttonminus" type="button" #minusBOX>-</button>
            </div>  
            <div class="form-line" id="box-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputBOX min="1" readonly>
            </div>
            <div class="form-line" id="box-hold1-item">
              <img src="assets/images/pause.png">
              <input type="number" value="4" #hold1InputBOX min="1" readonly>
            </div>
            <div class="form-line" id="box-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="4" #exhaleInputBOX min="1" readonly>
            </div>
            <div class="form-line" id="box-hold2-item">
              <img src="assets/images/pause.png">
              <input type="number" value="4" #hold2InputBOX min="1" readonly>
            </div>
            <div class="form-line" id="box-plus-btn">
              <button class="buttonplus" type="button" #plusBOX>+</button>
            </div>
          </div>
          <div class="BOXtimer-container">
            <select #BOXtimeInput class="countdownDisplay" id="box-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #BOXcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnBOX class="ballButton" id="box-start-ball">
              <div #BOXball class="ball">
                <span #BOXballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="box-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnBOX" #stopBtnBOX>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="BOXSave" #BOXSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="BOXForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneBOX>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayBOX>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #BOXResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
