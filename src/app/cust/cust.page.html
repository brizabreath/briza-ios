<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
      <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsCUST" #settingsCUST class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionCUST type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="custPage">
    <div class="breathingpages2">
      <p class="centeredText" *ngIf="!isPortuguese">Tap numbers to choose ratio</p>
      <p class="centeredText" *ngIf="isPortuguese">Clique nos números para escolher proporção</p>
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form CUST">
            <div class="form-line" id="cust-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" inputmode="numeric" pattern="[0-9]*" value="4" #inhaleInputCUST min="1" max="99" onblur="this.value = Math.max(2, Math.min(99, this.value))">
            </div>
            <div class="form-line" id="cust-hold1-item">
              <img src="assets/images/pause.png">
              <input type="number" inputmode="numeric" pattern="[0-9]*" value="4" #hold1InputCUST min="0" max="99" onblur="this.value = Math.max(0, Math.min(99, this.value))">
            </div>
            <div class="form-line" id="cust-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" inputmode="numeric" pattern="[0-9]*" value="4" #exhaleInputCUST min="1" max="99" onblur="this.value = Math.max(2, Math.min(99, this.value))">
            </div>
            <div class="form-line" id="cust-hold2-item">
              <img src="assets/images/pause.png">
              <input type="number" inputmode="numeric" pattern="[0-9]*" value="4" #hold2InputCUST min="0" max="99" onblur="this.value = Math.max(0, Math.min(99, this.value))">
            </div>
          </div>
          <div class="CUSTtimer-container">
            <select #CUSTtimeInput class="countdownDisplay" id="cust-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #CUSTcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnCUST class="ballButton">
              <div #CUSTball class="ball">
                <span #CUSTballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="cust-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnCUST" #stopBtnCUST>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="CUSTSave" #CUSTSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="CUSTForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneCUST>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayCUST>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #CUSTResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
