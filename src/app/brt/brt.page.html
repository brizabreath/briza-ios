<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="BRTSettings" #BRTSettings class="audioSet" type="button"><img src="assets/images/settings.png" id="hp-settings"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionBRT type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="brtPage">
    <div class="breathingpages2">
      <p class="centeredText" *ngIf="!isPortuguese">Hold after exhalation and pause at <br> your first natural urge to breathe</p>
      <p class="centeredText" *ngIf="isPortuguese">Segure a respiração após a expiração e pause <br> ao sentir o primeiro impulso natural de respirar</p>
      <div class="main-container">
        <div class="timer-status"> 
          <div class="settings-form AP">
            <div class="form-line" id="brt-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="3" readonly>
            </div>
            <div class="form-line" id="brt-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="3" readonly>
            </div>
            <div class="form-line" id="brt-hold-item">
              <img src="assets/images/hold.png">
              <input value="∞" readonly>
            </div>
          </div>
          <div class="center-container">
            <button #brtStart class="ballButton">
              <div #BRTball class="ball">
                <span #BRTballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="hp-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="brtStop" #brtStop>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtnBRT" id="brtSave" #brtSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="brtForm">
              <div class="timerDisplayBRT hiddenElements">
                <input id="timerDisplayBRT" #timerDisplayBRT readonly value="00 : 00" />
              </div>
            </form>
          </div>
        </div>
      </div>
      <div id="brtResultSaved" #brtResultSaved class="resultSaved">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
