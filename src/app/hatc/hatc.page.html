<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
      <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsHATC" #settingsHATC class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionHATC type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="hatcPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form HATC">
            <div class="form-line" id="hatc-hold-item">
              <img src="assets/images/hold.png">
              <input value="∞" #holdInputHATC min="1" readonly>
            </div>
            <div class="form-line" id="hatc-normal-item">
              <img src="assets/images/nor.png">
              <input type="number" value="60" #normalInputHATC min="1" readonly>
            </div>
          </div>
          <div class="HATCtimer-container">
            <select #HATCtimeInput class="countdownDisplay" id="hatc-rounds-box">
              <option value="infinity">∞ rounds</option>
              <option value="1">1 round</option>
            </select>
            <input #HATCcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnHATC class="ballButton">
              <div #HATCball class="ball">
                <span #HATCballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="hatc-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="HATCReset" #HATCReset>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="HATCSave" #HATCSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="HATCForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneHATC>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayHATC>00 : 00</div>
              </div>
            </form>
            <div #HATCResults></div>
          </div>
        </div>
      </div>
      <div #HATCResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
