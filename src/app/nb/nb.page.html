<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsNB" #settingsNB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionNB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="nbPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form NB">
            <div class="form-line" id="nb-minus-btn">
              <button class="buttonminus" type="button" #minusNB>-</button>
            </div>  
            <div class="form-line" id="nb-inhale-right-item">
              <img src="assets/images/inr.png">
              <input type="number" value="4" #inhaleInputNB min="1" readonly>
            </div>
            <div class="form-line" id="nb-exhale-right-item">
              <img src="assets/images/outl.png">
              <input type="number" value="4" #hold1InputNB min="1" readonly>
            </div>
            <div class="form-line" id="nb-inhale-left-item">
              <img src="assets/images/inl.png">
              <input type="number" value="4" #exhaleInputNB min="1" readonly>
            </div>
            <div class="form-line" id="nb-exhale-left-item">
              <img src="assets/images/outr.png">
              <input type="number" value="4" #hold2InputNB min="1" readonly>
            </div>
            <div class="form-line" id="nb-plus-btn">
              <button class="buttonplus" type="button" #plusNB>+</button>
            </div>
          </div>
          <div class="NBtimer-container">
            <select #NBtimeInput class="countdownDisplay" id="nb-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #NBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnNB class="ballButton">
              <div #NBball class="ball">
                <span #NBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="nb-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnNB" #stopBtnNB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="NBSave" #NBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="NBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneNB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayNB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #NBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
