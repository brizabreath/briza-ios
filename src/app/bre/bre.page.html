<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsBRE" #settingsBRE class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionBRE type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="brePage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form BRE">
            <div class="form-line" id="bre-minus-btn">
              <button class="buttonminus" type="button" #minusBRE>-</button>
            </div>  
            <div class="form-line" id="bre-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputBRE min="1" readonly>
            </div>
            <div class="form-line" id="bre-hold1-item">
              <img src="assets/images/out.png">
              <input type="number" value="4" #hold1InputBRE min="1" readonly>
            </div>
            <div class="form-line" id="bre-exhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #exhaleInputBRE min="1" readonly>
            </div>
            <div class="form-line" id="bre-hold2-item">
              <img src="assets/images/out.png">
              <input type="number" value="4" #hold2InputBRE min="1" readonly>
            </div>
            <div class="form-line" id="bre-hold3-item">
              <img src="assets/images/pause.png">
              <input type="number" value="3" #hold3InputBRE min="1" readonly>
            </div>
            <div class="form-line" id="bre-plus-btn">
              <button class="buttonplus" type="button" #plusBRE>+</button>
            </div>
          </div>
          <div class="BREtimer-container">
            <select #BREtimeInput class="countdownDisplay" id="bre-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #BREcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnBRE class="ballButton">
              <div #BREball class="ball">
                <span #BREballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="bre-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnBRE" #stopBtnBRE>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="BRESave" #BRESave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="BREForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneBRE>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayBRE>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #BREResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
