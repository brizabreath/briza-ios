<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsCT" #settingsCT class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionCT type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="ctPage">
    <div class="breathingpages2">
      <p class="centeredText" *ngIf="!isPortuguese">Press "Restart" if you<br>can no longer cope with the breath hold</p>
      <p class="centeredText" *ngIf="isPortuguese">Pressione "Reiniciar" quando você<br>não puder mais acompanhar a retenção</p>
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form CT">
            <div class="form-line" id="ct-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="3" #inhaleInputCT min="1" readonly>
            </div>
            <div class="form-line" id="ct-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="3" #exhaleInputCT min="1" readonly>
            </div>
            <div class="form-line" id="ct-hold-item">
              <img src="assets/images/pause.png">
              <input type="number" value="4" #hold1InputCT min="1" readonly>
            </div>
          </div>
          <div class="CTtimer-container">
            <select #CTtimeInput class="countdownDisplay" id="ct-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #CTcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnCT class="ballButton">
              <div #CTball class="ball">
                <span #CTballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="ct-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnCT" #stopBtnCT>
              <div *ngIf="!isPortuguese">Restart</div><div *ngIf="isPortuguese">Reiniciar</div>
            </button>
            <button type="button" class="stopBtn" id="CTReset" #CTReset>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="CTSave" #CTSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="CTForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneCT>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayCT>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #CTResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
