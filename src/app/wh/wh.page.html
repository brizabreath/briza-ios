<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader"> 
      <div class="settingButtons">
        <button routerLink="/setwh" id="settingsWH" #settingsWH class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionWH type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="whPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form WH">
            <div class="form-line" id="wh-breaths-item">
              <img src="assets/images/breaths.png">
              <input value="30" #breathsInputWH min="1" readonly>
            </div>
            <div class="form-line" id="wh-hold-item">
              <img src="assets/images/hold.png">
              <input value="∞" #hold1InputWH min="1" readonly>
            </div>
            <div class="form-line" id="wh-recovery-item">
              <img src="assets/images/pause.png">
              <input type="number" value="15" #hold2InputWH min="1" readonly>
            </div>
          </div>
          <div class="WHtimer-container">
            <select #WHtimeInput class="countdownDisplay" id="wh-rounds-box">
              <option value="infinity">∞ rounds</option>
              <option value="1">1 round</option>
            </select>
            <input #WHcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div *ngIf="showFixedRoundButton" class="fixed-round-button">
            <button type="button" (click)="openFixedRoundsModal()" *ngIf="!isPortuguese">Set holding times</button>
            <button type="button" (click)="openFixedRoundsModal()" *ngIf="isPortuguese">Definir tempos de retenção</button>
          </div>
          <div class="center-container">
            <button #startBtnWH class="ballButton">
              <div #WHball class="ball">
                <span #WHballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="wh-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="WHReset" #WHReset>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="WHSave" #WHSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="WHForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneWH>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayWH>00 : 00</div>
              </div>
            </form>
            <div #WHResults></div>
          </div>
        </div>
      </div>
      <div #WHResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
  <!-- Modal for fixed round durations -->
  <div id="fixedRoundsModal" class="modal" #fixedRoundsModal>
    <div class="modal-content fixedRoundsModal">
      <span class="close" (click)="closeFixedRoundsModal()">&times;</span>
      <h3 *ngIf="!isPortuguese">Set time of holds</h3>
      <p *ngIf="!isPortuguese">Leave 0 if you don't want to set time</p>
      <h3 *ngIf="isPortuguese">Definir tempos de retenção</h3>
      <p *ngIf="isPortuguese">Deixe 0 se não quiser definir os tempos</p>
      <div *ngFor="let round of fixedRoundDurations; let i = index" class="round-input">
        <label class="round-label" *ngIf="!isPortuguese">Hold {{ i + 1 }}</label>
        <label class="round-label" *ngIf="isPortuguese">Retenção {{ i + 1 }}</label>
        <div class="time-inputs">
          <input type="number" inputmode="numeric" min="0"
                [(ngModel)]="fixedRoundDurations[i].minutes"
                placeholder="min" onblur="this.value = Math.max(0, Math.min(20, this.value))"/>
          <span>min :</span>
          <input type="number" inputmode="numeric" min="0" max="59"
                [(ngModel)]="fixedRoundDurations[i].seconds"
                placeholder="sec" onblur="this.value = Math.max(0, Math.min(59, this.value))"/>
          <span *ngIf="!isPortuguese">sec</span>
          <span *ngIf="isPortuguese">seg</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
