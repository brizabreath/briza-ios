<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsDB" #settingsDB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionDB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="dbPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form DB">
            <div class="form-line" id="db-minus-btn">
              <button class="buttonminus" type="button" #minusDB>-</button>
            </div>  
            <div class="form-line" id="db-inhale1-item">
              <img src="assets/images/in.png">
              <input type="number" value="3" #inhaleInputDB min="1" readonly>
            </div>
            <div class="form-line" id="db-inhale2-item">
              <img src="assets/images/in.png">
              <input type="number" value="2" #exhaleInputDB min="1" readonly>
            </div>
            <div class="form-line" id="db-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="5" #hold2InputDB min="1" readonly>
            </div>
            <div class="form-line" id="db-plus-btn">
              <button class="buttonplus" type="button" #plusDB>+</button>
            </div>
          </div>
          <div class="DBtimer-container">
            <select #DBtimeInput class="countdownDisplay" id="db-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #DBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnDB class="ballButton">
              <div #DBball class="ball">
                <span #DBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="db-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnDB" #stopBtnDB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="DBSave" #DBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="DBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneDB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayDB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #DBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
