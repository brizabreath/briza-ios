<ion-content>
  <header class="mainHeader">
    <div class="back-buttons">
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
      <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="questionMark questionClass2">
        <a id="questionPrana" #questionPrana (click)="startGuide()">
          <img class="questionIMG" src="assets/images/question.png" />
        </a>
      </div>
    </div>
  </header>

  <div id="pranaPage">
    <div class="segmented-control">
      <button class="segment" [class.active]="selectedSegment === 'traditional'" (click)="selectSegment('traditional')" id="prana-traditional-segment">
        <div *ngIf="!isPortuguese">Traditional</div>
        <div *ngIf="isPortuguese">Tradicional</div>
      </button>
      <button class="segment" [class.active]="selectedSegment === 'regulation'" (click)="selectSegment('regulation')" id="prana-regulation-segment">
        <div *ngIf="!isPortuguese">Regulation</div>
        <div *ngIf="isPortuguese">Regulação</div>
      </button>
    </div>

    <div class="segment-content">
      <div *ngIf="selectedSegment === 'traditional'" class="bhgrid">
        <div class="row g-2">
          <div class="col locker-container">
            <a routerLink="/ub">
              <img class="homepageimgs5" [src]="isPortuguese ? 'assets/images/ubPT.svg' : 'assets/images/ub.svg'" />
              <img *ngIf="!isMember" src="assets/images/unlock.png" class="locker-icon" alt="Free to use" />
            </a>
          </div>
          <div class="col locker-container">
            <a routerLink="/box">
              <img class="homepageimgs5" [src]="isPortuguese ? 'assets/images/boxPT.svg' : 'assets/images/box.svg'" />
              <img *ngIf="!isMember" src="assets/images/unlock.png" class="locker-icon" alt="Free to use" />
            </a>
          </div>
          <div class="w-100"></div>
          <div class="col">
            <a routerLink="/yogic">
              <img class="homepageimgs5" [src]="isPortuguese ? 'assets/images/ybPT.svg' : 'assets/images/yb.svg'" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/nb">
              <img class="homepageimgs5" [src]="isPortuguese ? 'assets/images/nbPT.svg' : 'assets/images/nb.svg'" />
            </a>
          </div>
          <div class="w-100"></div>
          <div class="col">
            <a routerLink="/kb">
              <img class="homepageimgs5" [src]="isPortuguese ? 'assets/images/kbPT.svg' : 'assets/images/kb.svg'" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/hum">
              <img class="homepageimgs5" [src]="isPortuguese ? 'assets/images/humPT.svg' : 'assets/images/hum.svg'" />
            </a>
          </div>
        </div>
      </div>

      <div *ngIf="selectedSegment === 'regulation'" class="bhgrid">
        <div class="row g-2">
          <div class="col locker-container">
            <a routerLink="/rb">
              <img class="homepageimgs4" [src]="isPortuguese ? 'assets/images/rbPT.svg' : 'assets/images/rb.svg'" />
              <img *ngIf="!isMember" src="assets/images/unlock.png" class="locker-icon" alt="Free to use" />
            </a>
          </div>
          <div class="col locker-container">
            <a routerLink="/cb">
              <img class="homepageimgs4" [src]="isPortuguese ? 'assets/images/cbPT.svg' : 'assets/images/cb.svg'" />
              <img *ngIf="!isMember" src="assets/images/unlock.png" class="locker-icon" alt="Free to use" />
            </a>
          </div>
          <div class="w-100"></div>
          <div class="col">
            <a routerLink="/bb">
              <img class="homepageimgs4" [src]="isPortuguese ? 'assets/images/bbPT.svg' : 'assets/images/bb.svg'" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/db">
              <img class="homepageimgs4" [src]="isPortuguese ? 'assets/images/dbPT.svg' : 'assets/images/db.svg'" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
