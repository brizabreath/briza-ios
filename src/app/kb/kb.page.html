<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/setkb" id="settingsKB" #settingsKB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionKB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>   
  <div id="kbPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form KB">
            <div class="form-line" id="kb-breaths-item">
              <img src="assets/images/breaths.png">
              <input value="30" #breathsInputKB min="1" readonly>
            </div>
            <div class="form-line" id="kb-hold-item">
              <img src="assets/images/hold.png">
              <input value="∞" #hold1InputKB min="1" readonly>
            </div>
            <div class="form-line" id="kb-recovery-item">
              <img src="assets/images/nor.png">
              <input type="number" value="30" #hold2InputKB min="1" readonly>
            </div>
          </div>
          <div class="KBtimer-container">
            <select #KBtimeInput class="countdownDisplay" id="kb-rounds-box">
              <option value="infinity">∞ rounds</option>
              <option value="1">1 round</option>
            </select>
            <input #KBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div *ngIf="showFixedRoundButton" class="fixed-round-button">
            <button *ngIf="!isPortuguese" type="button" (click)="openFixedRoundsModal()">Set holding times</button>
            <button *ngIf="isPortuguese" type="button" (click)="openFixedRoundsModal()">Definir tempos de retenção</button>
          </div>
          <div class="center-container">
            <button #startBtnKB class="ballButton">
              <div #KBball class="ball">
                <span #KBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="kb-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="KBReset" #KBReset>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="KBSave" #KBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="KBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneKB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayKB>00 : 00</div>
              </div>
            </form>
            <div #KBResults></div>
          </div>
        </div>
      </div>
      <div #KBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
  <!-- Modal for fixed round durations -->
  <div id="fixedRoundsModalKB" class="modal" #fixedRoundsModalKB>
    <div class="modal-content fixedRoundsModal">
      <span class="close" (click)="closeFixedRoundsModal()">&times;</span>
      <h3 *ngIf="!isPortuguese">Set time of holds</h3>
      <p *ngIf="!isPortuguese">Leave 0 if you don't want to set time</p>
      <h3 *ngIf="isPortuguese">Definir tempo de retencoes</h3>
      <p *ngIf="isPortuguese">Deixe 0 se não quiser definir os tempos</p>
      <div *ngFor="let round of fixedRoundDurations; let i = index" class="round-input">
        <label class="round-label" *ngIf="!isPortuguese">Hold {{ i + 1 }}</label>
        <label class="round-label" *ngIf="isPortuguese">Retenção {{ i + 1 }}</label>
        <div class="time-inputs">
          <input type="number" inputmode="numeric" min="0"
                [(ngModel)]="fixedRoundDurations[i].minutes"
                placeholder="min" onblur="this.value = Math.max(0, Math.min(20, this.value))"/>
          <span>min :</span>
          <input type="number" inputmode="numeric" min="0" max="59"
                [(ngModel)]="fixedRoundDurations[i].seconds"
                placeholder="sec" onblur="this.value = Math.max(0, Math.min(59, this.value))"/>
          <span *ngIf="!isPortuguese">sec</span>
          <span *ngIf="isPortuguese">seg</span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
