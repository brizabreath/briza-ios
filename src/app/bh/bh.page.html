<ion-content>
  <header class="mainHeader">
    <div class="back-buttons">
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
      <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="questionMark questionClass2">
        <a id="questionBH" #questionBH (click)="startGuide()">
          <img class="questionIMG" src="assets/images/question.png" />
        </a>
      </div>
    </div>
  </header>

  <div id="bhPage">
    <!-- Segmented Control -->
    <div class="segmented-control">
      <button
        class="segment"
        [class.active]="selectedSegment === 'endurance'"
        (click)="selectSegment('endurance')"
        id="bh-endurance-segment">
        <div *ngIf="!isPortuguese">Endurance</div>
        <div *ngIf="isPortuguese">Resistência</div>
      </button>
      <button
        class="segment"
        [class.active]="selectedSegment === 'hold'"
        (click)="selectSegment('hold')"
        id="bh-hold-segment">
        <div *ngIf="!isPortuguese">Max Hold</div>
        <div *ngIf="isPortuguese">Retenção Máxima</div>
      </button>
    </div>

    <!-- Segment Content -->
    <div class="segment-content">
      <!-- Endurance -->
      <div *ngIf="selectedSegment === 'endurance'" class="bhgrid">
        <div class="row g-2">
          <div class="col locker-container">
            <a routerLink="/ap">
              <img class="homepageimgs4"
                   [src]="isPortuguese ? 'assets/images/apPT.svg' : 'assets/images/ap.svg'" />
              <img *ngIf="!isMember" src="assets/images/unlock.png" class="locker-icon" alt="Free to use" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/ct">
              <img class="homepageimgs4"
                   [src]="isPortuguese ? 'assets/images/ctPT.svg' : 'assets/images/ct.svg'" />
            </a>
          </div>
          <div class="w-100"></div>
          <div class="col">
            <a routerLink="/bre">
              <img class="homepageimgs4"
                   [src]="isPortuguese ? 'assets/images/brePT.svg' : 'assets/images/bre.svg'" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/brw">
              <img class="homepageimgs4"
                   [src]="isPortuguese ? 'assets/images/brwPT.svg' : 'assets/images/brw.svg'" />
            </a>
          </div>
        </div>
      </div>

      <!-- Hold -->
      <div *ngIf="selectedSegment === 'hold'" class="bhgrid">
        <div class="row g-2">
          <div class="col">
            <a routerLink="/wh">
              <img class="homepageimgs5"
                   [src]="isPortuguese ? 'assets/images/whPT.svg' : 'assets/images/wh.svg'" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/hat">
              <img class="homepageimgs5"
                   [src]="isPortuguese ? 'assets/images/hatPT.svg' : 'assets/images/hat.svg'" />
            </a>
          </div>
          <div class="w-100"></div>
          <div class="col">
            <a routerLink="/hatc">
              <img class="homepageimgs5"
                   [src]="isPortuguese ? 'assets/images/hatcPT.svg' : 'assets/images/hatc.svg'" />
            </a>
          </div>
          <div class="col">
            <a routerLink="/ahat">
              <img class="homepageimgs5"
                   [src]="isPortuguese ? 'assets/images/ahatPT.svg' : 'assets/images/ahat.svg'" />
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</ion-content>
