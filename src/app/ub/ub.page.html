<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader"> 
      <div class="settingButtons">
        <button routerLink="/set" id="settingsUB" #settingsUB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionUB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="ubPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form UB">
            <div class="form-line" id="ub-minus-btn">
              <button class="buttonminus" type="button" #minusUB>-</button>
            </div>  
            <div class="form-line" id="ub-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputUB min="1" readonly>
            </div>
            <div class="form-line" id="ub-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="4" #exhaleInputUB min="1" readonly>
            </div>
            <div class="form-line" id="ub-plus-btn">
              <button class="buttonplus" type="button" #plusUB>+</button>
            </div>
          </div>
          <div class="UBtimer-container">
            <select #UBtimeInput class="countdownDisplay" id="ub-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #UBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnUB class="ballButton">
              <div #UBball class="ball">
                <span #UBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="ub-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnUB" #stopBtnUB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="UBSave" #UBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="UBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneUB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayUB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #UBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
