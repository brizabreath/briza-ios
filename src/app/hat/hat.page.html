<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
      <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsHAT" #settingsHAT class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionHAT type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="hatPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form HAT">
            <div class="form-line" id="hat-hold-item">
              <img src="assets/images/hold.png">
              <input value="∞" #holdInputHAT min="1" readonly>
            </div>
            <div class="form-line" id="hat-light-item">
              <img src="assets/images/lit.png">
              <input type="number" value="15" #lightInputHAT min="1" readonly>
            </div>
            <div class="form-line" id="hat-normal-item">
              <img src="assets/images/nor.png">
              <input type="number" value="30" #normalInputHAT min="1" readonly>
            </div>
          </div>
          <div class="HATtimer-container">
            <select #HATtimeInput class="countdownDisplay" id="hat-rounds-box">
              <option value="infinity">∞ rounds</option>
              <option value="1">1 round</option>
            </select>
            <input #HATcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnHAT class="ballButton">
              <div #HATball class="ball">
                <span #HATballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="hat-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="HATReset" #HATReset>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="HATSave" #HATSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="HATForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneHAT>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayHAT>00 : 00</div>
              </div>
            </form>
            <div #HATResults></div>
          </div>
        </div>
      </div>
      <div #HATResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
