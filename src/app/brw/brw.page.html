<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsBRW" #settingsBRW class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionBRW type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="brwPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form BRW">
            <div class="form-line" id="brw-minus-btn">
              <button class="buttonminus" type="button" #minusBRW>-</button>
            </div>  
            <div class="form-line" id="brw-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #inhaleInputBRW min="1" readonly>
            </div>
            <div class="form-line" id="brw-hold1-item">
              <img src="assets/images/out.png">
              <input type="number" value="4" #hold1InputBRW min="1" readonly>
            </div>
            <div class="form-line" id="brw-exhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="4" #exhaleInputBRW min="1" readonly>
            </div>
            <div class="form-line" id="brw-hold2-item">
              <img src="assets/images/out.png">
              <input type="number" value="4" #hold2InputBRW min="1" readonly>
            </div>
            <div class="form-line" id="brw-hold3-item">
              <img src="assets/images/pause.png">
              <input type="number" value="3" #hold3InputBRW min="1" readonly>
            </div>
            <div class="form-line" id="brw-plus-btn">
              <button class="buttonplus" type="button" #plusBRW>+</button>
            </div>
          </div>
          <div class="BRWtimer-container">
            <select #BRWtimeInput class="countdownDisplay" id="brw-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #BRWcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnBRW class="ballButton">
              <div #BRWball class="ball">
                <span #BRWballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="brw-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnBRW" #stopBtnBRW>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="BRWSave" #BRWSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="BRWForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneBRW>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayBRW>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #BRWResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
