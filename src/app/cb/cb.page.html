<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader">
      <div class="settingButtons">
        <button routerLink="/set" id="settingsCB" #settingsCB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionCB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>   
  <div id="cbPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form CB">
            <div class="form-line" id="cb-inhale-item">
              <img src="assets/images/in.png">
              <input type="number" value="5.5" #inhaleInputCB id="inhaleInputCB" min="1" readonly>
            </div>
            <div class="form-line" id="cb-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="5.5" #exhaleInputCB id="exhaleInputCB" min="1" readonly>
            </div>
          </div>
          <div class="CBtimer-container">
            <select #CBtimeInput class="countdownDisplay" id="cb-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #CBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnCB class="ballButton">
              <div #CBball class="ball">
                <span #CBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="cb-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnCB" #stopBtnCB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="CBSave" #CBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="CBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneCB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayCB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #CBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
