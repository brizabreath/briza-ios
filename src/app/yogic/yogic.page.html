<ion-content>
  <header class="mainHeader">
    <div class="back-buttons"> 
      <button class="goback" (click)="goBack()">&#8249;</button>
    </div>
    <div class="logo-container">
        <img class="logoimg" src="assets/images/blogo.png" width="50" height="50" />
    </div>
    <div class="placeholderHeader"> 
      <div class="settingButtons">
        <button routerLink="/set" id="settingsYB" #settingsYB class="audioSet" type="button"><img src="assets/images/settings.png"></button>
      </div>  
      <div class="questionMark questionClass">
        <button #questionYB type="button" (click)="startGuide()"><img class="questionIMG" src="assets/images/question.png"></button>
      </div>
    </div>
  </header>  
  <div id="yogicPage">
    <div class="breathingpages">
      <div class="main-container">
        <div class="timer-status">
          <div class="settings-form YB">
            <div class="form-line" id="yb-minus-btn">
              <button class="buttonminus" type="button" #minusYB>-</button>
            </div>  
            <div class="form-line" id="yb-inhale-belly-item">
              <img src="assets/images/in.png">
              <input type="number" value="3" #inhaleInputYB min="1" readonly>
            </div>
            <div class="form-line" id="yb-inhale-ribs-item">
              <img src="assets/images/in.png">
              <input type="number" value="3" #hold1InputYB min="1" readonly>
            </div>
            <div class="form-line" id="yb-inhale-chest-item">
              <img src="assets/images/in.png">
              <input type="number" value="3" #exhaleInputYB min="1" readonly>
            </div>
            <div class="form-line" id="yb-exhale-item">
              <img src="assets/images/out.png">
              <input type="number" value="9" #hold2InputYB min="1" readonly>
            </div>
            <div class="form-line" id="yb-plus-btn">
              <button class="buttonplus" type="button" #plusYB>+</button>
            </div>
          </div>
          <div class="YBtimer-container">
            <select #YBtimeInput class="countdownDisplay" id="yb-duration-select">
              <option value="infinity" *ngIf="!isPortuguese">∞ minutes</option>
              <option value="infinity" *ngIf="isPortuguese">∞ minutos</option>
              <option value="60" *ngIf="!isPortuguese">1 minute</option>
              <option value="60" *ngIf="isPortuguese">1 minuto</option>
            </select>
            <input #YBcountdownInput class="countdownDisplay" style="display: none;" readonly />
          </div>
          <div class="center-container">
            <button #startBtnYB class="ballButton">
              <div #YBball class="ball">
                <span #YBballText></span>
                <img src="assets/images/3dBall.png" alt="3D Ball" id="yb-start-ball">
              </div>
            </button>
          </div>
          <div class="timer-controls">
            <button type="button" class="stopBtn" id="stopBtnYB" #stopBtnYB>
              <div *ngIf="!isPortuguese">Reset</div><div *ngIf="isPortuguese">Resetar</div>
            </button>
            <button type="button" class="saveBtn" id="YBSave" #YBSave>
              <div *ngIf="!isPortuguese">Save</div><div *ngIf="isPortuguese">Salvar</div>
            </button>
            <form method="post" id="YBForm">
              <div class="roundbox">
                <div>Rounds:</div><div #roundsDoneYB>0</div>
                <div *ngIf="!isPortuguese">Total time:</div><div *ngIf="isPortuguese">Tempo Total:</div><div #timerDisplayYB>00 : 00</div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div #YBResultSaved class="resultSaved hiddenElements">
        <div *ngIf="!isPortuguese">Result successfully saved</div>
        <div *ngIf="isPortuguese">Resultado salvo com sucesso</div>
      </div>
    </div>
  </div>
</ion-content>
